name: Release Workflow

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Publish to npm & GitHub Releases
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Run tests & build
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: Pack verified CLI tarball
        run: |
          mkdir -p release
          package_version="${GITHUB_REF_NAME#v}"
          npm pack --pack-destination release
          tar -tzf "release/rulesync-${package_version}.tgz" >/dev/null
          sha256sum "release/rulesync-${package_version}.tgz" > "release/rulesync-${package_version}.tgz.sha256"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/*
            release/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
